name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Run Release Please
              uses: google-github-actions/release-please-action@v4
              id: release
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  release-type: node

            - name: Checkout code
              if: ${{ steps.release.outputs.release_created }}
              uses: actions/checkout@v4

            - name: Set up Node.js
              if: ${{ steps.release.outputs.release_created }}
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install & Build
              if: ${{ steps.release.outputs.release_created }}
              run: |
                  npm ci
                  npm run build
